name: build-proot

on:
  workflow_dispatch:

jobs:
  build:
    # 原生 arm64 runner（公开仓库免费）；私有仓库可改成 ubuntu-latest 并先加 qemu 步骤
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Build static proot (Alpine, arm64)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" alpine:3.20 sh -c '
            set -e
            apk add --no-cache build-base git linux-headers bsd-compat-headers talloc-dev talloc-static file
            git clone --depth 1 https://github.com/proot-me/proot
            cd proot/src
            make LDFLAGS="-static"
            cp proot /out/libproot.so
            cp loader/loader /out/libproot-loader.so
            file /out/*
            readelf -d /out/libproot.so | grep NEEDED || echo "no dynamic deps (static)"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: proot-arm64
          path: out/*
